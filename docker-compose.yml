version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: groovarr-backend
    restart: unless-stopped
    environment:
      - PORT=${PORT:-8080}
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - DB_PATH=${DB_PATH:-/data/groovarr.db}
      - DB_SALT=${DB_SALT:-}
    volumes:
      - groovarr-data:/data
    networks:
      - groovarr-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8080
    container_name: groovarr-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - groovarr-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  groovarr-net:
    driver: bridge

volumes:
  groovarr-data:
    driver: local