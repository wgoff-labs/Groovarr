version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: groovarr-backend
    restart: unless-stopped
    environment:
      - PORT=${PORT:-8080}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-changeme}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_HOME_CHANNEL=${DISCORD_HOME_CHANNEL:-0}
      - DISCORD_ALLOWED_CHANNELS=${DISCORD_ALLOWED_CHANNELS:-}
      - DISCORD_ALLOWED_USERS=${DISCORD_ALLOWED_USERS:-}
      - DISCORD_ALLOW_ALL_USERS=${DISCORD_ALLOW_ALL_USERS:-true}
      - DISCORD_AUTO_THREAD=${DISCORD_AUTO_THREAD:-false}
      - DISCORD_REQUIRE_MENTION=${DISCORD_REQUIRE_MENTION:-false}
      - COMMAND_PREFIX=${COMMAND_PREFIX:-?}
      - POPULARITY_THRESHOLD=${POPULARITY_THRESHOLD:-60}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LIDARR_URL=${LIDARR_URL:-http://localhost:8686}
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - LIDARR_QUALITY_PROFILE=${LIDARR_QUALITY_PROFILE:-Standard}
      - LIDARR_ROOT_FOLDER=${LIDARR_ROOT_FOLDER:-}
      - DOWNLOAD_MODE=${DOWNLOAD_MODE:-tracks}
      - DAILY_CHECK_CRON=${DAILY_CHECK_CRON:-0 9 * * *}
      - TIMEZONE=${TIMEZONE:-America/Detroit}
      - DB_PATH=/data/watchlist.db
    volumes:
      - groovarr-data:/data
    networks:
      - groovarr-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: groovarr-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - groovarr-net

networks:
  groovarr-net:
    driver: bridge

volumes:
  groovarr-data:
    driver: local
