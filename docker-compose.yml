services:
  groovarr:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        CACHE_BUST: "8"
    container_name: groovarr
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - DB_PATH=/data/groovarr.db
      - DB_SALT=${DB_SALT:-}
    volumes:
      - groovarr-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: groovarr-net
    driver: bridge

volumes:
  groovarr-data:
    driver: local
